name: Feature request
description: Suggest a new protocol, option, distro or workflow.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the storage setup or workflow, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution(s) involved
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SMB / CIFS
        - NFS
        - iSCSI
        - NVMe-oF
        - fstab / systemd persistence
        - disks / filesystems
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
