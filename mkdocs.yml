site_name: storctl
site_description: Mount SMB/CIFS, NFS, iSCSI and NVMe-oF storage on Linux with one curl-runnable Bash script.
site_url: https://iadityaharsh.github.io/storctl/
site_author: Aditya Harsh
repo_url: https://github.com/iadityaharsh/storctl
repo_name: iadityaharsh/storctl
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Aditya Harsh

docs_dir: docs
site_dir: site
use_directory_urls: true
not_in_nav: |
  /404.md

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: images/storctl-mark.svg
  favicon: images/storctl-mark-512.png
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install: install-storctl.md
  - Protocols:
      - SMB / CIFS: mount-smb-cifs-share-on-linux.md
      - NFS: mount-nfs-export-on-linux.md
      - iSCSI: connect-iscsi-target-on-linux.md
      - NVMe-oF: connect-nvme-of-target-on-linux.md
  - Persistence: persist-network-mounts-at-boot.md
  - Troubleshooting: troubleshooting-network-mounts.md
  - Comparison: comparison.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iadityaharsh/storctl
      name: storctl on GitHub
